name: Reusable Zensical documentation release

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish; use a fully qualified tag ref for releases.
        required: true
        type: string
      config_file:
        description: Zensical configuration file.
        required: false
        default: zensical.toml
        type: string
      site_dir:
        description: Built static-site directory.
        required: false
        default: site
        type: string
      python_version:
        description: Python version used for the documentation build.
        required: false
        default: "3.x"
        type: string
      zensical_version:
        description: Zensical version used for the documentation build; latest unless set.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Zensical Pages
    runs-on: ubuntu-latest
    # One deployment at a time, so the newest-release check below runs right before publishing.
    concurrency:
      group: zensical-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Zensical
        env:
          ZENSICAL_VERSION: ${{ inputs.zensical_version }}
        run: python -m pip install --upgrade "zensical${ZENSICAL_VERSION:+==$ZENSICAL_VERSION}"

      - name: Build released documentation
        env:
          ZENSICAL_CONFIG: ${{ inputs.config_file }}
        run: zensical build --config-file "${ZENSICAL_CONFIG}" --clean --strict

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.site_dir }}

      - name: Check that the tag is still the newest stable release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "${PUBLISH_REF}" in
            refs/tags/*) ;;
            *)
              echo "current=true" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "refs/tags/${latest}" == "${PUBLISH_REF}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${PUBLISH_REF#refs/tags/} is not the newest stable release (${latest}); skipping deployment."
          fi

      - name: Deploy Pages
        id: deployment
        if: ${{ steps.newest.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
